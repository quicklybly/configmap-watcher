name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive and validate version from tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-RC[0-9]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a release tag. Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-RCn (e.g. v0.1.0, v0.1.0-RC1)."
            exit 1
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-RC* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $version"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build -Pversion=${{ steps.version.outputs.version }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check publishing secrets are present
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$USERNAME" ]]       || missing+=(MAVEN_CENTRAL_USERNAME)
          [[ -n "$PASSWORD" ]]       || missing+=(MAVEN_CENTRAL_PASSWORD)
          [[ -n "$GPG_KEY" ]]        || missing+=(GPG_PRIVATE_KEY)
          [[ -n "$GPG_PASSPHRASE" ]] || missing+=(GPG_PASSPHRASE)
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Upload to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew :configmap-watcher:publishToMavenCentral -Pversion=${{ needs.verify.outputs.version }}

      - name: Next step
        run: |
          echo "### Uploaded ${{ needs.verify.outputs.version }} to Maven Central" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing is public yet. Review the deployment at <https://central.sonatype.com/publishing/deployments> and click **Publish** to release it, or drop it to discard." >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          base="${VERSION%%-RC*}"
          if [[ -f CHANGELOG.md ]]; then
            awk -v v="$base" '
              $0 ~ "^## \\[" v "\\]" { flag = 1; next }
              flag && /^## / { exit }
              flag { print }
            ' CHANGELOG.md > notes.md
          else
            : > notes.md
          fi
          if [[ -s notes.md ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CHANGELOG.md section for $base; falling back to generated notes."
          fi

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          NOTES_FOUND: ${{ steps.notes.outputs.found }}
        run: |
          set -euo pipefail
          args=(--draft --title "$TAG")
          # Deliberately an if, not `[[ ... ]] && ...`: under `set -e` a false condition would
          # make the whole AND-list return non-zero and abort the step.
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          if [[ "$NOTES_FOUND" == "true" ]]; then
            args+=(--notes-file notes.md)
          else
            args+=(--generate-notes)
          fi
          gh release create "$TAG" "${args[@]}"
